<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orders | KkTF Admin</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-page is-guarded">

  <!-- NAVBAR -->
  <header class="navbar navbar--admin">
    <div class="navbar__left">
      <a href="admin.html" class="navbar__logo">KkTF</a>
      <span class="admin-tag">Admin</span>
    </div>

    <div class="navbar__actions">
      <span class="admin-user" id="adminName"></span>
      <a href="index.html" class="admin-link">View site</a>
      <button class="icon-btn" id="themeToggle" aria-label="Ganti tema">
        <img src="assets/icons/moon.svg" alt="">
      </button>
      <button type="button" class="admin-link admin-link--danger" id="adminLogout">Logout</button>
    </div>
  </header>

  <div class="admin">

    <!-- SIDEBAR -->
    <nav class="admin__sidebar" aria-label="Menu admin">
      <a href="admin.html" class="side-link">
        <svg class="side-link__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
        Dashboard
      </a>
      <a href="admin-menu.html" class="side-link">
        <svg class="side-link__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8h14v5a5 5 0 0 1-5 5H8a5 5 0 0 1-5-5V8z"/><path d="M17 9h2a2 2 0 0 1 0 5h-2"/><path d="M7 3v2M11 3v2"/></svg>
        Menu
      </a>
      <a href="admin-orders.html" class="side-link is-active" aria-current="page">
        <svg class="side-link__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2h12v20l-3-2-3 2-3-2-3 2z"/><path d="M9 7h6M9 11h6"/></svg>
        Orders
      </a>
    </nav>

    <!-- ISI -->
    <main class="admin__main">

      <div class="page-head">
        <h1 class="page-title">Orders</h1>
      </div>

      <div class="toolbar">
        <div class="seg seg--wrap" role="group" aria-label="Filter status" id="statusTabs">
          <button type="button" class="seg__btn is-active" data-status="" aria-pressed="true">All <span class="seg__count" data-count="all"></span></button>
          <button type="button" class="seg__btn" data-status="new" aria-pressed="false">New <span class="seg__count" data-count="new"></span></button>
          <button type="button" class="seg__btn" data-status="preparing" aria-pressed="false">Preparing <span class="seg__count" data-count="preparing"></span></button>
          <button type="button" class="seg__btn" data-status="done" aria-pressed="false">Done <span class="seg__count" data-count="done"></span></button>
          <button type="button" class="seg__btn" data-status="cancelled" aria-pressed="false">Cancelled <span class="seg__count" data-count="cancelled"></span></button>
        </div>

        <div class="fld fld--grow">
          <label class="visually-hidden" for="searchOrder">Search order number</label>
          <input type="search" id="searchOrder" placeholder="Search order number">
        </div>
      </div>

      <p class="table-note" id="orderCount" aria-live="polite"></p>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th scope="col">Order</th>
              <th scope="col">Time</th>
              <th scope="col">Type</th>
              <th scope="col">Items</th>
              <th scope="col">Total</th>
              <th scope="col">Payment</th>
              <th scope="col">Status</th>
            </tr>
          </thead>
          <tbody id="orderBody"></tbody>
        </table>
        <p class="panel__empty" id="orderEmpty" hidden>No orders match your filter.</p>
      </div>

      <div class="more">
        <button type="button" class="a-btn a-btn--ghost" id="moreOrders" hidden>Show more</button>
      </div>

    </main>
  </div>

  <script src="js/script.js" defer></script>
  <script src="js/admin.js" defer></script>
  <script src="js/admin-orders.js" defer></script>
</body>
</html>
